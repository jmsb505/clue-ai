[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clue-ai"
version = "0.1.0"
description = "Local-first personal job discovery with TypeSafe Jev fit signals"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "Jinja2>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "scrapling[fetchers]==0.4.15",
  "typesafe-sdk>=0.1,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["clue_ai*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
